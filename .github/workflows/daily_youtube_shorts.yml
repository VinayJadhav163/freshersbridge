name: Daily YouTube Shorts Autoposter

on:
  schedule:
    # 3 Times Daily at peak Indian student browsing hours (Zero-Queue Contention):
    # Synchronized to run ~20 mins after scraper publishes fresh morning/midday/evening jobs.
    # 1. 03:07 UTC = 08:37 AM IST (Morning commute / wake-up peak)
    # 2. 08:07 UTC = 01:37 PM IST (College lunch break browsing)
    # 3. 13:57 UTC = 07:27 PM IST (Evening prime-time job hunting)
    - cron: '7 3,8 * * *'
    - cron: '57 13 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Privacy status for uploaded Short (public, unlisted, private)'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      force:
        description: 'Bypass 150-minute cooldown guard'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-youtube-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-daily-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Setup YouTube API Credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          echo "$YOUTUBE_CLIENT_SECRET" > credentials/youtube_client_secret.json
          echo "$YOUTUBE_TOKEN" > credentials/youtube_token.json

      - name: Generate & Publish Daily YouTube Short & Social Reels
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            python scraper/daily_shorts_autoposter.py --privacy "$PRIVACY" --force
          else
            python scraper/daily_shorts_autoposter.py --privacy "$PRIVACY"
          fi

      - name: Commit & Push Updated Social Publishing History
        run: |
          git config --global user.name "FreshersBridge Social Bot"
          git config --global user.email "bot@freshersbridge.in"
          git add data/posted_youtube_shorts.json data/posted_meta_reels.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): update YouTube Shorts and Meta Reels publishing history [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No changes to commit. Working tree clean."
          fi
