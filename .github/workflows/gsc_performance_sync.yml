name: Google Search Console Performance Sync

on:
  schedule:
    - cron: '22 4 * * 2' # Runs every Tuesday at 04:22 UTC (Off-peak minute prevents queue delays)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: gsc-performance-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Run GSC Analytics Sync Bot
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: |
          python scraper/gsc_performance_syncer.py

      - name: Commit and Push Updated GSC Performance
        run: |
          git config --global user.name "FreshersBridge SEO Bot"
          git config --global user.email "seo@freshersbridge.in"
          git add data/gsc_performance.json data/gsc_insights.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): auto-sync Google Search Console performance [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No changes in Search Console performance."
          fi
