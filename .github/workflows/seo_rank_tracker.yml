name: FreshersBridge Weekly SEO Rank Tracker

on:
  schedule:
    - cron: '24 3 * * 1' # Every Monday at 03:24 UTC (~08:54 AM IST - Off-peak minute)
  workflow_dispatch:     # Allows manual 1-click execution from GitHub Actions tab

concurrency:
  group: seo-rank-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Free SEO Rank Tracker
        run: |
          python scraper/seo_rank_tracker.py

      - name: Commit and Push Updated Rank Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seo_rank_report.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo): update weekly search rankings report [skip ci]" && git push)
