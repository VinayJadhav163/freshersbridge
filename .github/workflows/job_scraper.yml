name: FreshersBridge 3x Daily Job Scraper & Broadcast Automation

on:
  schedule:
    - cron: '7 3 * * *'   # ~08:37 AM IST (Morning Curated Digest - Zero Queue Contention)
    - cron: '23 8 * * *'  # ~01:53 PM IST (Afternoon Curated Digest - Zero Queue Contention)
    - cron: '37 13 * * *' # ~07:07 PM IST (Evening Curated Digest - Zero Queue Contention)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Multi-Source Job Scraper & Direct DB Auto-Publisher
        env:
          FRESHERSBRIDGE_API_URL: ${{ secrets.FRESHERSBRIDGE_API_URL || 'https://freshersbridge.in/api/admin/jobs/bulk' }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY || 'freshersbridgeadmin2026' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL || 'http://65.0.170.65:8080' }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY || 'FreshersBridgeSecret2026' }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID || '120363410671332403@g.us' }}
        run: |
          python scraper/main.py

      - name: Upload Scraped Jobs Backup CSV
        uses: actions/upload-artifact@v4
        with:
          name: freshersbridge-scraped-jobs-csv
          path: scraper/output/
          retention-days: 7

