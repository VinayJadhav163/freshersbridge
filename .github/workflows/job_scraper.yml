name: FreshersBridge 12-Hour Job Scraper & Auto-Publisher

on:
  schedule:
    - cron: '0 0,12 * * *' # Runs automatically every 12 hours (00:00 & 12:00 UTC)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Multi-Source Job Scraper & Direct DB Auto-Publisher
        env:
          FRESHERSBRIDGE_API_URL: ${{ secrets.FRESHERSBRIDGE_API_URL || 'https://freshersbridge.in/api/admin/jobs/bulk' }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper/main.py

      - name: Upload Scraped Jobs Backup CSV
        uses: actions/upload-artifact@v4
        with:
          name: freshersbridge-scraped-jobs-csv
          path: scraper/output/
          retention-days: 7

