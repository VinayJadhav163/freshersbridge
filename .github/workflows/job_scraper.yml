name: FreshersBridge 2-Hour Job Scraper

on:
  schedule:
    - cron: '0 */2 * * *' # Runs every 2 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Multi-Source Job Scraper Pipeline
        env:
          FRESHERSBRIDGE_API_URL: ${{ secrets.FRESHERSBRIDGE_API_URL }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scraper/main.py

      - name: Upload Scraped Jobs CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshersbridge-scraped-jobs-csv
          path: scraper/output/
          retention-days: 7
