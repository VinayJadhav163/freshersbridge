name: FreshersBridge 3x Daily Job Scraper & Broadcast Automation

on:
  schedule:
    - cron: '30 3 * * *'  # 09:00 AM IST (Morning Curated Digest)
    - cron: '30 8 * * *'  # 02:00 PM IST (Afternoon Curated Digest)
    - cron: '0 14 * * *'  # 07:30 PM IST (Evening Curated Digest)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Multi-Source Job Scraper & Direct DB Auto-Publisher
        env:
          FRESHERSBRIDGE_API_URL: ${{ secrets.FRESHERSBRIDGE_API_URL || 'https://freshersbridge.in/api/admin/jobs/bulk' }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY || 'freshersbridgeadmin2026' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PABBLY_WEBHOOK_URL: ${{ secrets.PABBLY_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python scraper/main.py

      - name: Upload Scraped Jobs Backup CSV
        uses: actions/upload-artifact@v4
        with:
          name: freshersbridge-scraped-jobs-csv
          path: scraper/output/
          retention-days: 7

