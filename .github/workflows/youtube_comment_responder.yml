name: YouTube Shorts Comment Auto-Responder
on:
  schedule:
    # Runs every 30 minutes to scan and auto-reply to viewers
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Specific YouTube Video ID to scan (leave blank to scan recent Shorts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Setup YouTube API Credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          echo "$YOUTUBE_CLIENT_SECRET" > credentials/youtube_client_secret.json
          echo "$YOUTUBE_TOKEN" > credentials/youtube_token.json

      - name: Scan Comments & Auto-Reply with Job Link
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          VIDEO_ID="${{ github.event.inputs.video_id }}"
          if [ -n "$VIDEO_ID" ]; then
            python scraper/youtube_comment_responder.py --video-id "$VIDEO_ID"
          else
            python scraper/youtube_comment_responder.py
          fi

      - name: Commit & Push Updated Reply History
        run: |
          git config --global user.name "FreshersBridge Bot"
          git config --global user.email "bot@freshersbridge.in"
          git add data/replied_youtube_comments.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): update YouTube Shorts auto-replied comments log [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit. Working tree clean."
          fi
